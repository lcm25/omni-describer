name: Release

# Pushing a tag vX.Y.Z builds the installer and the portable zip, checks the
# app, and publishes a GitHub Release. The version is audio_describer/version.py.
# The tag must be v plus that version. This workflow does not change the version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-test.yml
    with:
      ref: ${{ github.ref }}
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          find . -type f -print
          mapfile -t files < <(find . -type f \( -name '*.exe' -o -name '*.zip' \) | sort)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "Expected the installer and the portable zip"
            exit 1
          fi
          : > SHA256SUMS.txt
          for file in "${files[@]}"; do
            hash=$(sha256sum "$file" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$(basename "$file")" >> SHA256SUMS.txt
          done
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          gh release create "$tag" \
            --title "Descritudo $ver" \
            --notes "Descritudo $ver" \
            "${files[@]}" SHA256SUMS.txt
